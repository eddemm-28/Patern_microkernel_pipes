# =====================================================================
#  Registro de plugins del microkernel (Banco de Preguntas Saber PRO)
# ---------------------------------------------------------------------
#  Formato:  plugin.<clave> = <nombre completo de la clase del plugin>
#
#  El nucleo (QuestionMicrokernel) lee este archivo al iniciar y crea
#  cada plugin por REFLEXION:
#      Class.forName(clase).getDeclaredConstructor().newInstance()
#
#  Para agregar un nuevo tipo de pregunta basta con crear una clase que
#  implemente QuestionPlugin y registrarla aqui. El nucleo NO se modifica.
# =====================================================================
plugin.multiple_choice = co.edu.unicauca.microkernel.plugins.MultipleChoiceQuestionPlugin
plugin.case            = co.edu.unicauca.microkernel.plugins.CaseQuestionPlugin
plugin.multimedia      = co.edu.unicauca.microkernel.plugins.MultimediaQuestionPlugin
